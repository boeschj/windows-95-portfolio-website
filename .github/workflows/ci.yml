name: CI

on:
    push:
        branches: [main]
    pull_request:
        branches: [main]

jobs:
    check:
        name: Check Format, Types, and Lint
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v4

            - name: Install Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: 1.3.14

            # Bun has no Payload CLI to trip over here (it only runs prettier /
            # tsc / eslint) and migrates the committed pnpm-lock.yaml on install,
            # so it resolves the same pinned versions without a second lockfile.
            - name: Install dependencies
              run: bun install

            - name: Check formatting
              run: bun run format

            - name: Check types
              run: bun run typecheck

            - name: Lint
              run: bun run lint
